</style><rect class="bg" width="760" height="512"/><text class="ink" x="20" y="22" font-size="13">6軸 正規化MSE（Eval、先頭5と続き5〜9の平均、小さいほど良い）</text><text class="ink2" x="20" y="40" font-size="12">型は正解で選択。推定側の規則は Dev で最良のもの（下段の小さい字）</text><text class="ink" x="20" y="74" font-size="15" font-weight="600">95型（向き・大きさを外した型、43/100 の構成）</text><line class="grid" x1="260.0" x2="260.0" y1="92" y2="252" stroke-width="1"/><text class="ink2" x="260.0" y="268" font-size="11" text-anchor="middle">0.00</text><line class="grid" x1="346.0" x2="346.0" y1="92" y2="252" stroke-width="1"/><text class="ink2" x="346.0" y="268" font-size="11" text-anchor="middle">0.05</text><line class="grid" x1="432.0" x2="432.0" y1="92" y2="252" stroke-width="1"/><text class="ink2" x="432.0" y="268" font-size="11" text-anchor="middle">0.10</text><line class="grid" x1="518.0" x2="518.0" y1="92" y2="252" stroke-width="1"/><text class="ink2" x="518.0" y="268" font-size="11" text-anchor="middle">0.15</text><line class="grid" x1="604.0" x2="604.0" y1="92" y2="252" stroke-width="1"/><text class="ink2" x="604.0" y="268" font-size="11" text-anchor="middle">0.20</text><line class="grid" x1="690.0" x2="690.0" y1="92" y2="252" stroke-width="1"/><text class="ink2" x="690.0" y="268" font-size="11" text-anchor="middle">0.25</text><text class="ink" x="252" y="111.0" font-size="13" text-anchor="end">両方正解</text><text class="ink2" x="252" y="125.0" font-size="10.5" text-anchor="end">向き=正解・大きさ=正解</text><rect class="bar" x="260" y="101.0" width="98.1" height="22" rx="4"/><text class="ink" x="363.1" y="116.0" font-size="12">0.057</text><text class="ink" x="252" y="151.0" font-size="13" text-anchor="end">向きだけ正解</text><text class="ink2" x="252" y="165.0" font-size="10.5" text-anchor="end">向き=正解・大きさ=直前の速さ</text><rect class="bar" x="260" y="141.0" width="162.9" height="22" rx="4"/><text class="ink" x="427.9" y="156.0" font-size="12">0.095</text><text class="ink" x="252" y="191.0" font-size="13" text-anchor="end">大きさだけ正解</text><text class="ink2" x="252" y="205.0" font-size="10.5" text-anchor="end">向き=π0.5・大きさ=正解</text><rect class="bar" x="260" y="181.0" width="189.6" height="22" rx="4"/><text class="ink" x="454.6" y="196.0" font-size="12">0.110</text><text class="ink" x="252" y="231.0" font-size="13" text-anchor="end">どちらも推定</text><text class="ink2" x="252" y="245.0" font-size="10.5" text-anchor="end">向き=π0.5・大きさ=直前の速さ</text><rect class="bar2" x="260" y="221.0" width="333.2" height="22" rx="4"/><text class="ink" x="598.2" y="236.0" font-size="12">0.194</text><line class="ref" x1="489.6" x2="489.6" y1="88" y2="252" stroke-width="1.5" stroke-dasharray="4 3"/><text class="refl" x="493.6" y="98" font-size="11">通常 π0.5 0.134</text><text class="ink" x="20" y="304" font-size="15" font-weight="600">1,595型（向きを型に残す scale-only W）</text><line class="grid" x1="260.0" x2="260.0" y1="322" y2="482" stroke-width="1"/><text class="ink2" x="260.0" y="498" font-size="11" text-anchor="middle">0.00</text><line class="grid" x1="346.0" x2="346.0" y1="322" y2="482" stroke-width="1"/><text class="ink2" x="346.0" y="498" font-size="11" text-anchor="middle">0.05</text><line class="grid" x1="432.0" x2="432.0" y1="322" y2="482" stroke-width="1"/><text class="ink2" x="432.0" y="498" font-size="11" text-anchor="middle">0.10</text><line class="grid" x1="518.0" x2="518.0" y1="322" y2="482" stroke-width="1"/><text class="ink2" x="518.0" y="498" font-size="11" text-anchor="middle">0.15</text><line class="grid" x1="604.0" x2="604.0" y1="322" y2="482" stroke-width="1"/><text class="ink2" x="604.0" y="498" font-size="11" text-anchor="middle">0.20</text><line class="grid" x1="690.0" x2="690.0" y1="322" y2="482" stroke-width="1"/><text class="ink2" x="690.0" y="498" font-size="11" text-anchor="middle">0.25</text><text class="ink" x="252" y="341.0" font-size="13" text-anchor="end">両方正解</text><text class="ink2" x="252" y="355.0" font-size="10.5" text-anchor="end">向き=正解・大きさ=正解</text><rect class="bar" x="260" y="331.0" width="123.8" height="22