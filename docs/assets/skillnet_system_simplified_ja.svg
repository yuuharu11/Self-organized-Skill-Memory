<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">SkillNetの公開LIBERO版：スキル情報を用いた行動生成</title>
<desc id="desc">画像、指示、ロボット状態をVLMで特徴化し、行動生成器へ渡す。注釈由来のタスク全体のスキル一覧を埋め込み、行動生成器内のMoEルーティングに使う。行動生成器はノイズを反復更新して行動列を出力する。行動の一部を実行し、次の観測で再計画する。</desc>
