<text x="82" y="112" dominant-baseline="text-before-edge" text-anchor="start" font-family="Noto Sans CJK JP,Noto Sans JP,Yu Gothic,Meiryo,sans-serif" font-size="23" fill="#60738A">公開LIBERO版の推論構造を簡略化  ／  ベース方策：π0.5</text>
